# 因爲【雙拼】使用的詞典就是【拼音簡化字】的詞典，所以輸入方案中原有的
# reverse_lookup/dictionary: pinyin_simp 保持不變，另外指定一項 prism

patch:
  __include: grammar:/hans_char
  switches/@next:
    name: emoji_suggestion
    reset: 1
    states: ["🚫", "😄"]
  emoji_suggestion:
    opencc_config: emoji_simp.json
    option_name: emoji_suggestion
    tips: none
    inherit_comment: false
  schema/dependencies: [double_pinyin_flypy_simp, japanese_kana]
  speller/delimiter: " ;'"
  key_binder/import_preset: null
  key_binder/bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - japanese_kana_key_bindings:/key_bindings
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch
  engine/translators:
    - punct_translator
    - table_translator
    - script_translator@japanese_hiragana
    - reverse_lookup_translator
  engine/filters:
    - simplifier@emoji_suggestion
    - simplifier@zh_hant
    - simplifier@zh_hant_tw
    - lua_filter@*hiragana_to_katakana
    - lua_filter@*kana_before_sentence
    - uniquifier
    - single_char_filter
  japanese_hiragana:
    dictionary: japanese_kana.hiragana
    enable_user_dict: false
    enable_sentence: true
    initial_quality: -1.0
  reverse_lookup/prism: double_pinyin_flypy_simp
  reverse_lookup/tips: 〔雙拼〕
  reverse_lookup/preedit_format: []

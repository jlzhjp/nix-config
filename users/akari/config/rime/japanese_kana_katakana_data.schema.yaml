# Rime schema
# encoding: utf-8

# Dependency schema used to compile the katakana dictionary. It is intentionally
# absent from default.custom.yaml; users select the combined japanese_kana schema.
schema:
  schema_id: japanese_kana_katakana_data
  name: 日本語カナ辞書
  version: "1.0"

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: japanese_kana.katakana
  enable_user_dict: false
  enable_sentence: true
